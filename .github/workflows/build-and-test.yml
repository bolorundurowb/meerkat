name: Build, Test & Coverage

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval 'try { rs.initiate() } catch (e) {}'; then break; fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then break; fi
            sleep 1
          done

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src

      - name: Build all projects
        run: dotnet build --configuration Release --no-restore
        working-directory: ./src

      - name: Run unit tests
        run: dotnet test --configuration Release --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage" --filter "Category!=Integration"
        working-directory: ./src

      - name: Run integration tests
        run: dotnet test --configuration Release --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage" --filter "Category=Integration"
        working-directory: ./src

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          fail_ci_if_error: true
